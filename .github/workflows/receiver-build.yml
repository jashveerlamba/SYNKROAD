name: Build Windows Receiver

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:

    runs-on: windows-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake
        run: |
          cmake -S receiver -B build -A x64

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Upload Receiver
        uses: actions/upload-artifact@v4
        with:
          name: SYNKROADReceiver
          path: |
            build/Release/*.exe