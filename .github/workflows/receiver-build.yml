name: SYNKROAD Build CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Auto-Detect and Build
      shell: powershell
      run: |
        Write-Host "--- Scanning Repository Files ---"
        Get-ChildItem -Path . -Recurse | Select-Object -ExpandProperty FullName

        # 1. Check for CMakeLists.txt
        $cmakeFile = Get-ChildItem -Path . -Filter "CMakeLists.txt" -Recurse | Select-Object -First 1
        if ($cmakeFile) {
            Write-Host "Found CMake project at: $($cmakeFile.DirectoryName)"
            Set-Location $cmakeFile.DirectoryName
            cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
            cmake --build build --config ${{ matrix.configuration }}
            exit $LASTEXITCODE
        }

        # 2. Check for .sln
        $slnFile = Get-ChildItem -Path . -Filter "*.sln" -Recurse | Select-Object -First 1
        if ($slnFile) {
            Write-Host "Found Solution at: $($slnFile.FullName)"
            msbuild /m /p:Configuration=${{ matrix.configuration }} /p:Platform="x64" "$($slnFile.FullName)"
            exit $LASTEXITCODE
        }

        # 3. Check for .vcxproj
        $vcxprojFile = Get-ChildItem -Path . -Filter "*.vcxproj" -Recurse | Select-Object -First 1
        if ($vcxprojFile) {
            Write-Host "Found C++ Project at: $($vcxprojFile.FullName)"
            msbuild /m /p:Configuration=${{ matrix.configuration }} /p:Platform="x64" "$($vcxprojFile.FullName)"
            exit $LASTEXITCODE
        }

        Write-Error "Could not find CMakeLists.txt, .sln, or .vcxproj in repository!"
        exit 1